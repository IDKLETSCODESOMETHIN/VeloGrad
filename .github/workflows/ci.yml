name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy
        pip install -e .

    - name: Verify package import and version
      run: |
        python -c "import velograd; print('VeloGrad Version:', velograd.__version__)"

    - name: Run Pytest test suite
      run: |
        pytest -v tests/test_phase1_python_api.py tests/test_exhaustive.py

    - name: Run Benchmarks (CPU verification)
      run: |
        python benchmarks/bench_vs_pytorch.py
        python benchmarks/profile_vram.py
