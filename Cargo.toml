[package]
name = "velograd"
version = "0.1.0"
edition = "2021"
authors = ["VeloGrad Architecture Core Team"]
description = "VeloGrad: Pure Compiled, Bare-Metal High-Performance Machine Learning Core Engine"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/velograd/velograd"
homepage = "https://velograd.ai"
keywords = ["machine-learning", "autograd", "cuda", "compiler", "deep-learning"]
categories = ["science", "mathematics", "hardware-support"]

[lib]
name = "velograd"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
numpy = { version = "0.20", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
